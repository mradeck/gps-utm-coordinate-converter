<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14171c">
  <meta name="description" content="GPS2UTM — GPS-Koordinaten direkt in ETRS89 / UTM, Gauß-Krüger und DHHN2016 umrechnen">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>GPS2UTM — Koordinaten</title>
  <script>
    // Interface-Farbe und Sprache vor dem ersten Zeichnen setzen (kein Aufblitzen).
    (function () {
      try {
        var th = localStorage.getItem('gps2utm.theme');
        if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
        var lg = localStorage.getItem('gps2utm.lang');
        document.documentElement.lang = lg === 'en' || lg === 'de' ? lg : (/^de\b/i.test(navigator.language || '') ? 'de' : 'en');
      } catch (e) { /* ohne Speicher: Systemvorgabe */ }
    })();
  </script>
  <style>
    /* Neutrales Farbschema. Dunkel ist die Grundlage, hell per data-theme oder Systemeinstellung. */
    :root {
      color-scheme: dark;
      --bg:#14171c; --panel:#1d2229; --panel2:#232a33; --border:#333c48;
      --text:#e6ebf1; --muted:#93a0af; --accent:#4da3ff; --on-accent:#0b1522; --ok:#46c07a; --warn:#e0a13c; --err:#e05c5c;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef1f5; --border:#d4dae2;
      --text:#1b2430; --muted:#5d6a79; --accent:#1f6fd1; --on-accent:#ffffff; --ok:#23824f; --warn:#a86400; --err:#c0392b;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef1f5; --border:#d4dae2;
        --text:#1b2430; --muted:#5d6a79; --accent:#1f6fd1; --on-accent:#ffffff; --ok:#23824f; --warn:#a86400; --err:#c0392b;
      }
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(760px,100%); margin:0 auto; padding:max(18px,env(safe-area-inset-top)) 16px 28px; flex:1 0 auto; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(1.45rem,7vw,2.15rem); line-height:1.08; }
    .brand { display:inline-flex; align-items:baseline; letter-spacing:-.045em; font-weight:900; }
    .brand-gps { color:var(--text); }
    .brand-two { color:var(--err); padding:0 .035em; }
    .brand-utm { color:var(--accent); }
    .brand-version { margin-left:.45rem; color:var(--muted); font-size:.34em; font-weight:500; letter-spacing:0; white-space:nowrap; }
    header p { margin:.45rem 0 0; color:var(--muted); }
    button { font:inherit; }
    .top-actions { display:flex; gap:6px; flex:0 0 auto; }
    .icon-btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-width:44px; height:44px; padding:0 10px; border:1px solid var(--border); border-radius:10px; background:var(--panel2); color:var(--text); cursor:pointer; font-size:.85rem; font-weight:600; }
    .icon-btn:hover { border-color:var(--accent); }
    .icon-btn svg { display:block; }
    .flag { width:21px; height:14px; border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,.25); }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .actions { display:grid; grid-template-columns:1fr auto; gap:10px; margin-bottom:14px; }
    .primary { min-height:52px; border:0; border-radius:10px; padding:0 18px; background:var(--accent); color:var(--on-accent); font-weight:800; cursor:pointer; }
    .secondary { min-height:52px; border:1px solid var(--border); border-radius:10px; padding:0 14px; background:var(--panel); color:var(--text); cursor:pointer; }
    .secondary:hover, .mini:hover { border-color:var(--accent); }
    .status { display:flex; gap:9px; align-items:center; min-height:44px; padding:10px 12px; margin-bottom:14px; border:1px solid var(--border); border-radius:10px; background:var(--panel2); color:var(--muted); }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
    .status.live .dot { background:var(--ok); box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 18%,transparent); }
    .grid { display:grid; gap:12px; }
    .card { padding:16px; background:var(--panel); border:1px solid var(--border); border-radius:10px; }
    .card h2 { margin:0 0 12px; font-size:.82rem; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; }
    .big { font-size:clamp(1.28rem,5.7vw,1.8rem); font-weight:800; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
    .big + .big { margin-top:3px; }
    .meta { margin-top:8px; color:var(--muted); font-size:.9rem; }
    .rows { display:grid; gap:0; }
    .row { display:grid; grid-template-columns:minmax(105px,.8fr) minmax(0,1.4fr); gap:12px; padding:10px 0; border-top:1px solid var(--border); }
    .row:first-child { border-top:0; padding-top:0; }
    .label { color:var(--muted); }
    .value { text-align:right; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .copy { cursor:pointer; color:var(--accent); background:transparent; border:0; padding:0; text-align:right; }
    details { margin-top:12px; }
    summary { color:var(--accent); cursor:pointer; }
    .notice { border-left:3px solid var(--warn); }
    .notice p { margin:.4rem 0 0; color:var(--muted); font-size:.9rem; }
    .manual { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin-top:12px; }
    input { width:100%; min-width:0; border:1px solid var(--border); border-radius:8px; padding:10px; background:var(--panel2); color:var(--text); font:inherit; }
    .mini { border:1px solid var(--border); border-radius:8px; background:var(--panel2); color:var(--text); padding:0 12px; cursor:pointer; }
    .disclaimer { margin:16px 2px 0; color:var(--muted); font-size:.8rem; }
    .hidden { display:none !important; }

    /* Fußleisten */
    .app-footer { background:var(--panel); border-top:1px solid var(--border); font-size:11px; padding-bottom:env(safe-area-inset-bottom); }
    .related-apps, .footer-meta, .footer-links { display:flex; align-items:center; flex-wrap:wrap; gap:6px 7px; }
    .related-apps { padding:8px 16px; }
    .related-apps strong { color:var(--muted); font-weight:550; margin-right:2px; }
    .footer-meta { justify-content:space-between; padding:7px 16px; border-top:1px solid var(--border); color:var(--muted); }
    .related-apps a, .footer-links a, .footer-links button {
      display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border:1px solid var(--border); border-radius:20px;
      background:var(--panel2); color:var(--muted); font:inherit; font-size:11px; line-height:1.5; text-decoration:none; cursor:pointer;
    }
    .app-footer a:hover, .app-footer button:hover { border-color:var(--accent); color:var(--text); }

    /* Dialoge */
    dialog { padding:0; border:1px solid var(--border); border-radius:12px; background:var(--panel); color:var(--text); width:min(640px,calc(100vw - 32px)); max-height:calc(100vh - 48px); }
    dialog::backdrop { background:rgba(0,0,0,.55); }
    .dlg-head { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 18px; border-bottom:1px solid var(--border); }
    .dlg-head h2 { margin:0; font-size:17px; }
    .dlg-head button, .btn { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 10px; font:inherit; font-size:14px; cursor:pointer; text-decoration:none; }
    .dlg-head button:hover, .btn:hover { border-color:var(--accent); }
    .dlg-body { padding:14px 18px 18px; font-size:14px; }
    .dlg-body .actions { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
    .dlg-body .addr { color:var(--accent); font-weight:600; }
    .dlg-body .muted { color:var(--muted); }
    .dlg-body table { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
    .dlg-body th, .dlg-body td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--border); vertical-align:top; }
    .dlg-body th { color:var(--muted); font-weight:500; width:38%; }
    .dlg-body a { color:var(--accent); }

    @media (min-width:680px) { .grid { grid-template-columns:1fr 1fr; } .wide { grid-column:1/-1; } }
    @media (max-width:390px) { .actions { grid-template-columns:1fr; } .secondary { min-height:44px; } .manual { grid-template-columns:1fr 1fr; } .manual button { grid-column:1/-1; min-height:42px; } .row { grid-template-columns:1fr; gap:2px; } .value,.copy { text-align:left; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1 class="brand" aria-label="GPS2UTM"><span class="brand-gps">GPS</span><span class="brand-two">2</span><span class="brand-utm">UTM</span><sup class="brand-version app-version"></sup></h1><p data-i18n="app.tagline"></p></div>
    <div class="top-actions">
      <button id="btn-theme" class="icon-btn" type="button"></button>
      <button id="btn-lang" class="icon-btn" type="button"></button>
    </div>
  </header>

  <div class="actions">
    <button id="gps" class="primary" type="button"></button>
    <button id="reference" class="secondary" type="button" data-i18n="btn.reference"></button>
  </div>
  <div id="status" class="status"><span class="dot"></span><span></span></div>

  <section id="results" class="grid hidden" aria-live="polite">
    <article class="card wide">
      <h2>ETRS89 / UTM</h2>
      <div id="utm-e" class="big"></div>
      <div id="utm-n" class="big"></div>
      <div id="utm-meta" class="meta"></div>
    </article>

    <article class="card">
      <h2 data-i18n="card.geo"></h2>
      <div class="rows">
        <div class="row"><span class="label" data-i18n="row.decimal"></span><button id="copy-decimal" class="copy value" type="button"></button></div>
        <div class="row"><span class="label" data-i18n="row.lat"></span><span id="lat-dms" class="value"></span></div>
        <div class="row"><span class="label" data-i18n="row.lon"></span><span id="lon-dms" class="value"></span></div>
        <div class="row"><span class="label" data-i18n="row.accuracy"></span><span id="accuracy" class="value"></span></div>
      </div>
    </article>

    <article class="card">
      <h2 data-i18n="card.heights"></h2>
      <div class="rows">
        <div class="row"><span class="label" data-i18n="row.ellHeight"></span><span id="ell-height" class="value"></span></div>
        <div class="row"><span class="label">GCG2016 ζ</span><span id="geoid-height" class="value"></span></div>
        <div class="row"><span class="label">DHHN2016 H</span><span id="normal-height" class="value"></span></div>
      </div>
      <p class="meta" data-i18n="heights.note"></p>
    </article>

    <article class="card wide">
      <h2 data-i18n="card.gk"></h2>
      <div id="gk-rows" class="rows"></div>
      <p class="meta" data-i18n="gk.note"></p>
    </article>

    <article id="reference-result" class="card notice wide hidden">
      <h2 data-i18n="ref.title"></h2>
      <div id="reference-text"></div>
      <p data-i18n="ref.target"></p>
    </article>
  </section>

  <details class="card" style="margin-top:12px">
    <summary data-i18n="manual.summary"></summary>
    <div class="manual"><input id="manual-lat" inputmode="decimal" data-i18n-aria-label="manual.latAria" data-i18n-placeholder="manual.lat"><input id="manual-lon" inputmode="decimal" data-i18n-aria-label="manual.lonAria" data-i18n-placeholder="manual.lon"><button id="manual-go" class="mini" type="button" data-i18n="manual.go"></button></div>
  </details>

  <p class="disclaimer" data-i18n="disclaimer"></p>
</main>

<footer class="app-footer">
  <nav class="related-apps" data-i18n-aria-label="footer.apps">

<script src="coordinate-tools.js?v=26.11.4.0"></script>
<script>
  'use strict';
  const APP_VERSION = '26.11.4.0';
  const APP_VERSION_CODE = `v${APP_VERSION}`;
  const { t } = window.I18N;
  const REF = { lat: 51 + 56 / 60 + 31.768 / 3600, lon: 13 + 53 / 60 + 46.094 / 3600, altitude: 94.04 };
  let watchId = null;
  let renderSequence = 0;
  let lastStatus = { key: 'status.ready', params: null, live: false };
  let lastRender = null;
  const $ = id => document.getElementById(id);
  const fmt = (value, digits = 2) => Number(value).toLocaleString(I18N.locale(), { minimumFractionDigits: digits, maximumFractionDigits: digits });

  // -------------------------------------------------------------------------
  // Sprache und Interface-Farbe
  // -------------------------------------------------------------------------
  const FLAG_DE = '<svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><path fill="#000" d="M0 0h30v7H0z"/><path fill="#d00" d="M0 7h30v6H0z"/><path fill="#ffce00" d="M0 13h30v7H0z"/></svg>';
  const FLAG_GB = '<svg class="flag" viewBox="0 0 60 40" aria-hidden="true"><defs><clipPath id="gb-clip"><path d="M0 0h60v40H0z"/></clipPath></defs><g clip-path="url(#gb-clip)"><path fill="#012169" d="M0 0h60v40H0z"/><path stroke="#fff" stroke-width="8" d="m0 0 60 40M0 40 60 0"/><path stroke="#c8102e" stroke-width="3" d="m0 0 60 40M0 40 60 0"/><path stroke="#fff" stroke-width="13" d="M30 0v40M0 20h60"/><path stroke="#c8102e" stroke-width="8" d="M30 0v40M0 20h60"/></g></svg>';
  const ICON = {
    auto: '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>',
    light: '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
    dark: '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z" fill="currentColor"/></svg>',
  };
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) { /* nur Sitzung */ } },
  };
  let themeMode = ['light', 'dark'].includes(store.get('gps2utm.theme')) ? store.get('gps2utm.theme') : 'auto';
  const lightQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;

  function applyTheme() {
    if (themeMode === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', themeMode);
    const light = themeMode === 'light' || (themeMode === 'auto' && lightQuery?.matches);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f3f5f8' : '#14171c');
    const btn = $('btn-theme');
    btn.innerHTML = ICON[themeMode];
    const label = t(`theme.${themeMode}`);
    btn.title = label; btn.setAttribute('aria-label', label);
  }
  $('btn-theme').addEventListener('click', () => {
    themeMode = themeMode === 'auto' ? 'light' : themeMode === 'light' ? 'dark' : 'auto';
    store.set('gps2utm.theme', themeMode);
    applyTheme();
  });
  lightQuery?.addEventListener?.('change', () => { if (themeMode === 'auto') applyTheme(); });

  function applyStaticTexts() {
    const lang = I18N.getLanguage();
    document.documentElement.lang = lang;
    document.title = `GPS2UTM ${APP_VERSION_CODE} — ${t('app.title')}`;
    document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria-label]').forEach(n => n.setAttribute('aria-label', t(n.dataset.i18nAriaLabel)));
    document.querySelectorAll('[data-i18n-placeholder]').forEach(n => n.setAttribute('placeholder', t(n.dataset.i18nPlaceholder)));
    const btn = $('btn-lang');
    btn.innerHTML = `${lang === 'de' ? FLAG_DE : FLAG_GB}<span>${lang.toUpperCase()}</span>`;
    btn.title = t('lang.toggle'); btn.setAttribute('aria-label', t('lang.toggle'));
    $('footer-version').textContent = t('footer.version', { v: APP_VERSION_CODE });
    const subject = kind => `GPS / UTM Converter ${APP_VERSION_CODE} – ${t(kind === 'bug' ? 'support.bugSubject' : 'support.contactSubject')}`;
    $('support-bugreport').href = `mailto:michael.radeck@email.de?subject=${encodeURIComponent(subject('bug'))}&body=${encodeURIComponent(t('support.bugBody'))}`;
    $('support-contact').href = `mailto:michael.radeck@email.de?subject=${encodeURIComponent(subject('contact'))}`;
    $('gps').textContent = t(watchId != null ? 'btn.gpsStop' : 'btn.gps');
    applyTheme();
  }
  $('btn-lang').addEventListener('click', () => {
    const next = I18N.getLanguage() === 'de' ? 'en' : 'de';
    store.set('gps2utm.lang', next);
    I18N.setLanguage(next);
  });
  I18N.onLanguageChange(() => {
    applyStaticTexts();
    renderStatus();
    if (lastRender) renderPosition(lastRender.lat, lastRender.lon, lastRender.options).catch(() => {});
  });

  document.querySelectorAll('.app-version').forEach(element => { element.textContent = APP_VERSION_CODE; });
  $('footer-year').textContent = String(new Date().getFullYear());
  $('footer-support').addEventListener('click', () => $('support-dialog').showModal());
  $('footer-licenses').addEventListener('click', () => $('licenses-dialog').showModal());

  // -------------------------------------------------------------------------
  // Umrechnung und Anzeige
  // -------------------------------------------------------------------------
  function renderStatus() {
    $('status').classList.toggle('live', lastStatus.live);
    const p = lastStatus.params && lastStatus.params.timestamp != null
      ? { time: new Date(lastStatus.params.timestamp).toLocaleTimeString(I18N.locale(), { hour:'2-digit', minute:'2-digit', second:'2-digit' }) }
      : lastStatus.params;
    $('status').querySelector('span:last-child').textContent = t(lastStatus.key, p);
  }
  function setStatus(key, params = null, live = false) {
    lastStatus = { key, params, live };
    renderStatus();
  }

  async function renderPosition(lat, lon, options = {}) {
    const seq = ++renderSequence;
    const c = GeoCoordinates.convert(lat, lon);
    lastRender = { lat, lon, options };
    $('results').classList.remove('hidden');
    $('utm-e').textContent = `E ${fmt(c.utm.easting)} m`;
    $('utm-n').textContent = `N ${fmt(c.utm.northing)} m`;
    $('utm-meta').textContent = t('utm.meta', { zone: c.utm.zoneBand, epsg: c.utm.epsg, prefixed: fmt(c.utm.prefixedEasting) });
    $('copy-decimal').textContent = `${lat.toFixed(8)}, ${lon.toFixed(8)}  ⧉`;
    $('copy-decimal').dataset.copy = `${lat.toFixed(8)}, ${lon.toFixed(8)}`;
    $('lat-dms').textContent = c.wgs84.latDms;
    $('lon-dms').textContent = c.wgs84.lonDms;
    $('accuracy').textContent = Number.isFinite(options.accuracy) ? t('acc.value', { v: fmt(options.accuracy, 0) }) : t('acc.na');
    $('ell-height').textContent = Number.isFinite(options.altitude)
      ? `${fmt(options.altitude)} m${Number.isFinite(options.altitudeAccuracy) ? ` (± ${fmt(options.altitudeAccuracy, 0)} m)` : ''}` : t('ell.missing');
    $('normal-height').textContent = Number.isFinite(options.altitude) ? t('normal.calc') : t('normal.noAlt');
    $('geoid-height').textContent = t('geoid.loading');
    $('gk-rows').innerHTML = [2, 3, 4, 5].map(zone => {
      const gk = GeoCoordinates.gaussKrueger(lat, lon, zone);
      const active = zone === c.gk.zone ? ` <strong>${t('gk.auto')}</strong>` : '';
      return `<div class="row"><span class="label">${t('gk.row', { zone, epsg: gk.epsg })}${active}</span><span class="value">${t('gk.value', { e: fmt(gk.easting), n: fmt(gk.northing) })}</span></div>`;
    }).join('');

    try {
      const geoid = await GeoCoordinates.geoidAt(lat, lon);
      if (seq !== renderSequence) return;
      $('geoid-height').textContent = Number.isFinite(geoid) ? `${fmt(geoid)} m` : t('geoid.outside');
      if (Number.isFinite(geoid) && Number.isFinite(options.altitude)) {
        $('normal-height').textContent = `${fmt(GeoCoordinates.normalHeight(options.altitude, geoid))} m NHN`;
      }
      if (options.reference) {
        $('reference-result').classList.remove('hidden');
        const de = c.utm.easting - 424122.72;
        const dn = c.utm.northing - 5755180.43;
        const dh = Number.isFinite(geoid) ? GeoCoordinates.normalHeight(REF.altitude, geoid) - 53.03 : NaN;
        $('reference-text').textContent = t('ref.deviation', { de: fmt(de, 3), dn: fmt(dn, 3), dh: fmt(dh, 3) });
      } else {
        $('reference-result').classList.add('hidden');
      }
    } catch (error) {
      if (seq === renderSequence) {
        $('geoid-height').textContent = t('geoid.failed');
        $('normal-height').textContent = t('normal.na');
      }
    }
  }

  $('gps').addEventListener('click', () => {
    if (!navigator.geolocation) { setStatus('status.noApi'); return; }
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; $('gps').textContent = t('btn.gps'); setStatus('status.paused'); return; }
    setStatus('status.locating');
    $('gps').textContent = t('btn.gpsStop');
    watchId = navigator.geolocation.watchPosition(position => {
      const p = position.coords;
      setStatus('status.live', { timestamp: position.timestamp }, true);
      renderPosition(p.latitude, p.longitude, { accuracy:p.accuracy, altitude:p.altitude, altitudeAccuracy:p.altitudeAccuracy });
    }, error => {
      setStatus(error.code === 1 ? 'status.denied' : 'status.unavailable');
      navigator.geolocation.clearWatch(watchId); watchId = null; $('gps').textContent = t('btn.gps');
    }, { enableHighAccuracy:true, maximumAge:1000, timeout:15000 });
  });

  $('reference').addEventListener('click', () => { setStatus('status.reference'); renderPosition(REF.lat, REF.lon, { altitude:REF.altitude, reference:true }); });
  $('manual-go').addEventListener('click', () => {
    const lat = Number(String($('manual-lat').value).replace(',', '.'));
    const lon = Number(String($('manual-lon').value).replace(',', '.'));
    try { renderPosition(lat, lon); setStatus('status.manual'); } catch (_) { setStatus('status.invalid'); }
  });
  $('copy-decimal').addEventListener('click', async e => { await navigator.clipboard?.writeText(e.currentTarget.dataset.copy || ''); setStatus('status.copied'); });

  applyStaticTexts();
  setStatus('status.ready');

  const query = new URLSearchParams(location.search);
  if (query.has('lat') && query.has('lon')) {
    const lat = Number(query.get('lat')), lon = Number(query.get('lon'));
    try { renderPosition(lat, lon); setStatus('status.query'); } catch (_) {}
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
